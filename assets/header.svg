<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" role="img" aria-labelledby="t d">
  <title id="t">Rory Herriman — the accidental developer</title>
  <desc id="d">Systems administrator by profession, developer by accident. Ideas, requirements and testing by Rory; most of the code by AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#101826"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6c35c"/>
      <stop offset="0.55" stop-color="#f3dc94"/>
      <stop offset="1" stop-color="#4f8cf0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#4f8cf0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4f8cf0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#1c2738" stroke-width="1"/>
    </pattern>
    <clipPath id="c1"><rect class="type t1" x="40" y="150" height="26" width="600"/></clipPath>
    <clipPath id="c2"><rect class="type t2" x="40" y="182" height="26" width="600"/></clipPath>
    <clipPath id="c3"><rect class="type t3" x="40" y="214" height="26" width="600"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace; }
    .type { animation-fill-mode: both; animation-timing-function: steps(62, end); }
    .t1 { animation-name: w1; animation-duration: 1.6s; animation-delay: 0.4s; }
    .t2 { animation-name: w2; animation-duration: 1.6s; animation-delay: 2.2s; }
    .t3 { animation-name: w3; animation-duration: 1.6s; animation-delay: 4.0s; }
    @keyframes w1 { from { width: 0px; } to { width: 600px; } }
    @keyframes w2 { from { width: 0px; } to { width: 600px; } }
    @keyframes w3 { from { width: 0px; } to { width: 600px; } }
    .cursor { animation: blink 1s steps(1, end) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .pulse.b { animation-delay: 0.8s; }
    .pulse.c { animation-delay: 1.6s; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @media (prefers-reduced-motion: reduce) {
      .type { animation: none; }
      .cursor, .pulse { animation: none; }
    }
  </style>

  <rect width="860" height="300" rx="14" fill="url(#bg)"/>
  <rect width="860" height="300" rx="14" fill="url(#grid)" opacity="0.55"/>
  <rect width="860" height="300" rx="14" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="859" height="299" rx="13.5" fill="none" stroke="#243247"/>

  <!-- window chrome -->
  <circle cx="28" cy="26" r="5.5" fill="#f85149"/>
  <circle cx="46" cy="26" r="5.5" fill="#d29922"/>
  <circle cx="64" cy="26" r="5.5" fill="#3fb950"/>
  <text x="430" y="30" text-anchor="middle" class="mono" font-size="12" fill="#6e7d93">rory@accidental-dev-lab: ~</text>

  <!-- name -->
  <text x="38" y="98" class="mono" font-size="46" font-weight="700" fill="url(#name)" letter-spacing="-1">rory herriman</text>
  <text x="40" y="128" class="mono" font-size="15" fill="#8b9bb4">systems administrator by profession · developer by accident</text>

  <!-- typed lines -->
  <g class="mono" font-size="16">
    <g clip-path="url(#c1)"><text x="40" y="168"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d4e5"> by day   → Azure · Windows Server · PowerShell · DevOps</tspan></text></g>
    <g clip-path="url(#c2)"><text x="40" y="200"><tspan fill="#3fb950">$</tspan><tspan fill="#c9d4e5"> by night → ideas + AI tools + an alarming amount of testing</tspan></text></g>
    <g clip-path="url(#c3)"><text x="40" y="232"><tspan fill="#3fb950">$</tspan><tspan fill="#e6c35c"> now      → Dawnward Chronicles (until the next shiny idea)</tspan></text></g>
    <rect class="cursor" x="40" y="250" width="10" height="18" fill="#3fb950"/>
  </g>

  <!-- status board -->
  <g transform="translate(640 60)" class="mono">
    <rect width="190" height="176" rx="10" fill="#0d1420" stroke="#243247"/>
    <text x="16" y="28" font-size="11" fill="#6e7d93" letter-spacing="1.5">STATUS BOARD</text>
    <line x1="16" y1="38" x2="174" y2="38" stroke="#1f2a3a"/>
    <circle class="pulse" cx="22" cy="60" r="5" fill="#3fb950"/>
    <text x="36" y="64" font-size="13" fill="#c9d4e5">servers</text>
    <text x="174" y="64" font-size="12" fill="#3fb950" text-anchor="end">green</text>
    <circle class="pulse b" cx="22" cy="90" r="5" fill="#3fb950"/>
    <text x="36" y="94" font-size="13" fill="#c9d4e5">raid frames</text>
    <text x="174" y="94" font-size="12" fill="#3fb950" text-anchor="end">green</text>
    <circle class="pulse c" cx="22" cy="120" r="5" fill="#d29922"/>
    <text x="36" y="124" font-size="13" fill="#c9d4e5">side projects</text>
    <text x="174" y="124" font-size="12" fill="#d29922" text-anchor="end">lots</text>
    <circle cx="22" cy="150" r="5" fill="#4f8cf0"/>
    <text x="36" y="154" font-size="13" fill="#c9d4e5">focus</text>
    <text x="174" y="154" font-size="12" fill="#4f8cf0" text-anchor="end">~37 min</text>
  </g>
</svg>
