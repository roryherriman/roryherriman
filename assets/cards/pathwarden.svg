  <text x="68" y="52" class="s" font-size="24" font-weight="700" fill="#e6edf3">Pathwarden</text>
  <g transform="translate(404 32)">
    <rect x="-133" y="0" width="133" height="22" rx="11" fill="#4f8cf0" fill-opacity="0.14" stroke="#4f8cf0" stroke-opacity="0.6"/>
