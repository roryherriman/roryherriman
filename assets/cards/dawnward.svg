<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" width="420" height="210" role="img" aria-label="Dawnward Chronicles: early development">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1420"/><stop offset="1" stop-color="#111a29"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e6c35c"/><stop offset="1" stop-color="#e6c35c" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .m { font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Consolas, "Liberation Mono", Menlo, monospace; }
    .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .dot { animation: p 2.4s ease-in-out infinite; }
    @keyframes p { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  </style>
  <rect width="420" height="210" rx="12" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="419" height="209" rx="11.5" fill="none" stroke="#243247"/>
  <rect x="16" y="0" width="200" height="3" fill="url(#edge)"/>
  <!-- Rising sun over a horizon: "dawnward" -->
  <g transform="translate(40 44)">
    <circle cx="0" cy="0" r="15" fill="none" stroke="#e6c35c" stroke-width="2"/>
    <path d="M-8 4 A8 8 0 0 1 8 4 Z" fill="#e6c35c"/>
    <line x1="-11" y1="4" x2="11" y2="4" stroke="#e6c35c" stroke-width="1.6"/>
    <g stroke="#e6c35c" stroke-width="1.4" stroke-linecap="round">
      <line x1="0" y1="-5" x2="0" y2="-9"/><line x1="-6" y1="-3" x2="-8.5" y2="-6"/><line x1="6" y1="-3" x2="8.5" y2="-6"/>
    </g>
  </g>
  <text x="68" y="52" class="s" font-size="22" font-weight="700" fill="#e6edf3">Dawnward Chronicles</text>
  <g transform="translate(404 70)">
    <rect x="-150" y="0" width="150" height="22" rx="11" fill="#4f8cf0" fill-opacity="0.14" stroke="#4f8cf0" stroke-opacity="0.6"/>
    <circle class="dot" cx="-137" cy="11" r="3.5" fill="#4f8cf0"/>
    <text x="-12" y="15" text-anchor="end" class="m" font-size="10.5" font-weight="700" fill="#4f8cf0" letter-spacing="0.6">EARLY DEVELOPMENT</text>
  </g>
  <text x="24" y="110" class="s" font-size="15" fill="#c9d4e5">Roleplay storytelling engine for WoW Classic.</text>
  <text x="24" y="132" class="s" font-size="15" fill="#c9d4e5">Planned: journal, story choices, TRP3 sync.</text>
  <text x="24" y="156" class="m" font-size="12" fill="#e6c35c">Lua · WoW API · Total RP 3 public API · MIT</text>
  <line x1="24" y1="170" x2="396" y2="170" stroke="#1f2a3a"/>
  <text x="24" y="192" class="m" font-size="11.5" fill="#8b9bb4">&gt; pre-alpha · no release yet · building v0.1</text>
</svg>
