  <text x="68" y="52" class="s" font-size="24" font-weight="700" fill="#e6edf3">WoW Coach</text>
  <g transform="translate(404 32)">
    <rect x="-83" y="0" width="83" height="22" rx="11" fill="#8b949e" fill-opacity="0.14" stroke="#8b949e" stroke-opacity="0.6"/>
    <circle class="dot" cx="-70" cy="11" r="3.5" fill="#8b949e"/>
    <text x="-12" y="15" text-anchor="end" class="m" font-size="10.5" font-weight="700" fill="#8b949e" letter-spacing="0.6">ON HOLD</text>
  </g>
  <text x="24" y="96" class="s" font-size="15" fill="#c9d4e5">Pull-by-pull review that lines up your</text>
